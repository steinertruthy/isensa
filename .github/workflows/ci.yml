name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || true
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Validate
        run: scripts/ci.sh
