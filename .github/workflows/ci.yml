name: CI
on:
  push:
    paths-ignore: ['website/**']
  # Every pull request runs this check: it is required to merge into main, and a check that
  # never starts would leave the pull request waiting forever.
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || true
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Validate
        run: scripts/ci.sh
