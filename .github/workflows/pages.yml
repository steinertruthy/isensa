name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  # Every pull request builds the site: the check is required to merge into main (see ci.yml).
  pull_request:
  workflow_dispatch:

# Least privilege: read the code; only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Override with repository variables when a custom domain is set (see website/README.md).
          SITE_URL: ${{ vars.SITE_URL || 'https://steinertruthy.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/isensa' }}
      - name: Verify the build
        run: npm run verify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://steinertruthy.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/isensa' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
