excluded:
  - Packages/SensaKit/.build
  - Sensa.xcodeproj
disabled_rules:
  - todo
  # SwiftUI containers take a trailing content closure after an accessory closure by design.
  - multiple_closures_with_trailing_closure
opt_in_rules:
  - empty_count
  - first_where
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - unused_optional_binding
line_length:
  warning: 160
  error: 220
  ignores_comments: true
file_length:
  warning: 400
  error: 600
type_body_length:
  warning: 300
  error: 450
function_body_length:
  warning: 80
  error: 120
identifier_name:
  min_length: 1
  excluded: [id, x, y, t, p, e, x86_64]
nesting:
  type_level: 2
cyclomatic_complexity:
  warning: 15
  error: 25
large_tuple:
  warning: 3
